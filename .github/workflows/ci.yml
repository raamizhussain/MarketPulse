name: MarketPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend API & Quant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r marketpulse_backend/requirements.txt
          pip install fastapi uvicorn pydantic-settings sqlalchemy aiosqlite passlib bcrypt python-multipart pyjwt email-validator pytest httpx

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ -v --maxfail=1

  frontend-build:
    name: React Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify TypeScript & Build Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -f Dockerfile.backend -t marketpulse-backend:test .

      - name: Build Frontend Docker Image
        run: docker build -f frontend/Dockerfile -t marketpulse-frontend:test ./frontend
